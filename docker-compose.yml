version: '3.9'

services:
  db:
    image: postgres:17-alpine
    container_name: talentverse_db
    restart: always
    environment:
      POSTGRES_DB: talentverse
      POSTGRES_USER: tv_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - talentverse_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tv_user -d talentverse"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: talentverse_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=talentverse;Username=tv_user;Password=${DB_PASSWORD};Pooling=true;Minimum Pool Size=1"
      JWT__TokenKey: ${JWT_TOKEN_KEY}
      # App Configuration (optional - defaults in appsettings.json)
      AppConfig__OtpLength: ${APP_CONFIG_OTP_LENGTH:-6}
      AppConfig__OtpExpiryMinutes: ${APP_CONFIG_OTP_EXPIRY_MINUTES:-5}
      AppConfig__MaxSkillsPerUser: ${APP_CONFIG_MAX_SKILLS_PER_USER:-10}
      AppConfig__InitialCreditBalance: ${APP_CONFIG_INITIAL_CREDIT_BALANCE:-50}
      # Rate Limiting (optional - defaults in appsettings.json)
      RateLimiting__PermitLimit: ${RATE_LIMITING_PERMIT_LIMIT:-10}
      RateLimiting__WindowMinutes: ${RATE_LIMITING_WINDOW_MINUTES:-1}
      # Email Configuration
      Email__SmtpHost: ${EMAIL_SMTP_HOST}
      Email__SmtpPort: ${EMAIL_SMTP_PORT}
      Email__SmtpUser: ${EMAIL_SMTP_USER}
      Email__SmtpPassword: ${EMAIL_SMTP_PASSWORD}
      Email__FromEmail: ${EMAIL_FROM_EMAIL}
      Email__FromName: ${EMAIL_FROM_NAME}
      # Cloudinary Configuration
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET}
      # Stripe Configuration
      Stripe__SecretKey: ${STRIPE_SECRET_KEY}
      Stripe__PublishableKey: ${STRIPE_PUBLISHABLE_KEY}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET}
      # OAuth Configuration
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET}
      Authentication__GitHub__ClientId: ${GITHUB_CLIENT_ID}
      Authentication__GitHub__ClientSecret: ${GITHUB_CLIENT_SECRET}
      # Frontend Configuration
      FrontendUrl: ${FRONTEND_URL}
    ports:
      - "5000:5000"
    networks:
      - talentverse_net

networks:
  talentverse_net:
    driver: bridge

volumes:
  postgres_data: